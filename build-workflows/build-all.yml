name: Build VoiceFlow Release (APK & EXE)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android Overlay APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Dependencies
        run: npm install
      - name: Build Web Assets
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build Android Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-Android-v2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows-exe:
    name: Build Windows Electron EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
      - name: Build Standalone Windows EXE
        run: npm run build:exe
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-Windows-v2-EXE
          path: release/*.exe

